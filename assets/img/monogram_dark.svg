<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Outer delicate luxury circular frame -->
    <circle cx="50" cy="50" r="46" stroke="#0F1E36" stroke-width="1" opacity="0.3"/>
    
    <!-- Central Interlocking NF Monogram with Premium Serifs -->
    <!-- Left vertical stem of N -->
    <path d="M32 28 V72" stroke="#0F1E36" stroke-width="2.5" stroke-linecap="square"/>
    <!-- Left-top and Left-bottom serifs on N -->
    <path d="M26 28 H38" stroke="#0F1E36" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 72 H38" stroke="#0F1E36" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Diagonal cross-stem of N -->
    <path d="M32 28 L56 72" stroke="#0F1E36" stroke-width="1.8" stroke-linecap="square"/>
    
    <!-- Right vertical stem (Shared by N and F) -->
    <path d="M56 28 V72" stroke="#0F1E36" stroke-width="2.5" stroke-linecap="square"/>
    <!-- Right-bottom serif -->
    <path d="M50 72 H62" stroke="#0F1E36" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Top Horizontal bar of F -->
    <path d="M56 28 H72" stroke="#0F1E36" stroke-width="2.5" stroke-linecap="square"/>
    <!-- Top-right delicate fashion serif of F -->
    <path d="M72 28 V34" stroke="#0F1E36" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Middle Horizontal bar of F -->
    <path d="M56 46 H68" stroke="#0F1E36" stroke-width="2" stroke-linecap="square"/>
    <!-- Middle-right delicate fashion serif of F -->
    <path d="M68 46 V50" stroke="#0F1E36" stroke-width="1.5" stroke-linecap="round"/>
</svg>
